[SERVICE]
    Flush               1
    Log_Level           info
    Parsers_File        /fluent-bit/etc/parsers.conf

[INPUT]
    Name                forward
    Listen              127.0.0.1
    Port                24224

[FILTER]
    Name                parser
    Match               *
    Key_Name            log
    Parser              json
    Reserve_Data        On
    Preserve_Key        Off

[OUTPUT]
    Name                http
    Match               *
    host                victoria
    port                9428
    uri                 /insert/jsonline?_stream_fields=cservice,environment&_msg_field=message&_time_field=timestamp
    format              json_lines
    json_date_format    iso8601
    compress            gzip