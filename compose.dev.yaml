services:
  frontend:
    image: node:26-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: npm run dev

  backend:
    image: eclipse-temurin:25-jdk
    working_dir: /app
    environment:
      - spring_profiles_active=prod
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    ports:
      - "8080:8080"
      - "35729:35729" # LiveReload port
    command: ./mvnw spring-boot:run
    
  db:
    image: postgres
    container_name: sctest-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db-init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

volumes:
  pgdata: