services:
  frontend:
    build: ./frontend
    container_name: sctest-frontend
    restart: unless-stopped
    environment:
      - ORIGIN=http://127.0.0.1
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
    networks:
      - frontend-network
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: sctest-backend
    restart: unless-stopped
    env_file: ./backend/.env
    networks:
      - db-network
      - frontend-network
    depends_on:
      - db

  db:
    image: postgres
    container_name: sctest-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
  #  environment:
  #    POSTGRES_USER: ${POSTGRES_USER}
  #    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #    POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db-init-scripts:/docker-entrypoint-initdb.d
    networks:
      - db-network

  nginx:
    image: nginx:alpine
    container_name: sctest-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-network
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:

networks:
  db-network:
    driver: bridge
  frontend-network:
    driver: bridge