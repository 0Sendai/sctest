services:
  frontend:
    build: ./frontend
    image: ghcr.io/0sendai/sctest/frontend:0.0.4
    container_name: sctest-frontend
    restart: unless-stopped
    environment:
      - ORIGIN=https://sendai-sctest.duckdns.org
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
    networks:
      - frontend-network
    depends_on:
      - backend

  backend:
    build: ./backend
    image: ghcr.io/0sendai/sctest/backend:0.0.4
    container_name: sctest-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - spring_profiles_active=prod
    networks:
      - db-network
      - frontend-network
    depends_on:
      - db
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"

  db:
    image: postgres
    container_name: sctest-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db-init-scripts:/docker-entrypoint-initdb.d
    networks:
      - db-network

  nginx:
    image: nginx:alpine
    container_name: sctest-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt:ro
    networks:
      - frontend-network
    depends_on:
      - frontend
      - backend

  certbot:
    image: infinityofspace/certbot_dns_duckdns:v1.9.0
    container_name: certbot
    volumes:
      - certs:/etc/letsencrypt
      - ./certbot/duckdns.ini:/duckdns.ini:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

volumes:
  pgdata:
  certs:

networks:
  db-network:
    driver: bridge
  frontend-network:
    driver: bridge